#
# nginx.conf — kontener `web`: serwuje SPA (Vite dist) + proxy /api → api:4000.
#
# try_files … /index.html — deep linki React Router (np. /ustawienia) nie dają 404
# po odświeżeniu. CSP: self + Google Fonts + tile OSM/Carto + OSRM + API localhost.
#
# Pomysł (alt): Caddy / Traefik z automatycznym TLS; osobny ingress w K8s;
# CDN (CloudFront) na assets zamiast expires w nginx.
#
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Za Cloudflare Tunnel origin widzi HTTP — bez tego Location z 301/308 idzie na http://…
    # (pentest #0). Relative Location + HSTS po stronie odpowiedzi do klienta.
    absolute_redirect off;
    port_in_redirect off;

    # Security headers (MVP / OWASP ASVS L1 basics)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    # HSTS: przeglądarka po pierwszym HTTPS nie wraca na http (uzupełnia Always Use HTTPS w CF).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self' http://127.0.0.1:4000 http://localhost:4000 https://router.project-osrm.org https://*.tile.openstreetmap.org; frame-ancestors 'none';" always;

    # ^~ — /api/ wygrywa z regexem rozszerzeń (jpg/png), inaczej upload 404.
    location ^~ /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tunnel / CF przekazuje oryginalny schemat klienta (https).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Statyczne pliki SEO — bez SPA fallback (inaczej crawler dostaje index.html).
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML i SW bez długiego cache — po deployu przeglądarka bierze nowy indeks chunków.
    # `expires` nie zdejmuje nagłówków bezpieczeństwa z server (inaczej niż add_header).
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # Vite content-hash — 1 rok + immutable tylko przy 200.
    # `always` doklejało ten nagłówek także do 404. Cloudflare zapamiętał taki 404
    # na rok (GaragePage-*.js istniał na originie, edge oddawał HIT 404).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @missing_asset;
    }

    location @missing_asset {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    # Ikony / fonty / inne static — dłuższy TTL niż 7d (Lighthouse)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
