<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Centralny katalog wydarzeń motorsportowych w Polsce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RacePortal" />
    <!-- manifest dołączany po load w main.tsx (poza critical chain) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>RACEPORTAL</title>
    <!-- Boot poza critical path inline — pliki w /public (CSP bez unsafe-inline na script). -->
    <link rel="stylesheet" href="/boot.css" />
    <script src="/boot-theme.js"></script>
    <!-- LCP hero (HomePage HERO_BG_TRACK) — discoverable przed JS; sync z api-types -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1617130644016-d318045a3958?auto=format&amp;fit=crop&amp;w=1280&amp;q=65&amp;fm=webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonty poza critical path: media=print nie blokuje renderu; criticalAssets.ts → media=all.
      Tylko używane wagi (bez italików) — mniejszy CSS z Google Fonts.
    -->
    <link
      id="google-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
