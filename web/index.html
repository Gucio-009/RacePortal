<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Centralny katalog wydarzeń motorsportowych w Polsce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RacePortal" />
    <!-- manifest dołączany po load w main.tsx (poza critical chain) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>RACEPORTAL</title>
    <!-- Pierwszy paint bez czekania na pełny CSS / fonty (mniej FOUC); Arctic z localStorage -->
    <style>
      html,
      body {
        margin: 0;
        background: #121212;
        color: #fff;
        min-width: 360px;
      }
      html[data-accent="arctic"],
      html[data-accent="arctic"] body {
        background: #f3f6fa;
        color: #17283d;
      }
      html[data-accent="sand"],
      html[data-accent="sand"] body {
        background: #f7f3eb;
        color: #29241f;
      }
      html[data-accent="blush"],
      html[data-accent="blush"] body {
        background: #fff5f7;
        color: #342630;
      }
      html.intro-cover,
      html.intro-cover body {
        background: var(--boot-bg, #07080a);
      }
      html.intro-cover::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 500;
        background: var(--boot-bg, #07080a);
      }
      html.intro-cover #root {
        visibility: hidden;
      }
      html[data-accent="redline"] { --boot-bg: #10080a; }
      html[data-accent="ice"] { --boot-bg: #070e1a; }
      html[data-accent="arctic"] { --boot-bg: #eef3f8; }
      html[data-accent="sand"] { --boot-bg: #f7f3eb; }
      html[data-accent="blush"] { --boot-bg: #fff5f7; }
      html {
        overflow-x: auto;
      }
      #root {
        min-height: 100vh;
        min-width: 360px;
      }
    </style>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("raceportal_settings") || "{}");
        var a = s.accent;
        var colors = {
          gold: "#FFD700",
          redline: "#FF3B3B",
          ice: "#7DD3FC",
          arctic: "#266CB3",
          sand: "#B78D54",
          blush: "#C56B89"
        };
        var surfaces = { arctic: "#F3F6FA", sand: "#F7F3EB", blush: "#FFF5F7" };
        if (colors[a]) {
          document.documentElement.dataset.accent = a;
          document.documentElement.style.setProperty("--race-accent", colors[a]);
          if (surfaces[a]) {
            var t = document.querySelector('meta[name="theme-color"]');
            if (t) t.setAttribute("content", surfaces[a]);
            var c = document.querySelector('meta[name="color-scheme"]');
            if (c) c.setAttribute("content", "light");
          }
        }
      } catch (e) {}
      try {
        if (sessionStorage.getItem("raceportal_intro_seen") !== "1") {
          document.documentElement.classList.add("intro-cover");
        }
      } catch (e) {}
    </script>
    <!-- LCP hero (HomePage HERO_BG_TRACK) — discoverable przed JS; sync z api-types -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1617130644016-d318045a3958?auto=format&amp;fit=crop&amp;w=1280&amp;q=65&amp;fm=webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonty poza critical path: media=print nie blokuje renderu; criticalAssets.ts → media=all.
      Tylko używane wagi (bez italików) — mniejszy CSS z Google Fonts.
    -->
    <link
      id="google-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
