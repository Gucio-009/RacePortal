#
# docker-compose.vm.yml — API + MySQL na wirtualce (Oracle / dowolny VPS).
#
# Front zostaje na Cloudflare Pages; tu tylko backend + baza (+ backup).
# Env: deploy/vm/.env.vm (z .env.vm.example). MySQL: deploy/vm/mysql-lowmem.cnf.
#
# Uruchomienie (z korzenia repo na VM):
#   docker compose -f docker-compose.vm.yml --env-file deploy/vm/.env.vm up -d --build
#
services:
  mysql:
    image: mysql:8.4
    container_name: raceportal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raceportal}
      MYSQL_USER: ${MYSQL_USER:-raceportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - raceportal_mysql_vm:/var/lib/mysql
      - ./deploy/vm/mysql-lowmem.cnf:/etc/mysql/conf.d/lowmem.cnf:ro
    # Brak publish 3306 na host — tylko sieć compose (bezpieczniej na publicznym IP).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    mem_limit: 384m

  api:
    build: ./backend
    container_name: raceportal-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-raceportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${MYSQL_USER:-raceportal}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-my.mailbux.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-kontakt@raceportal.pl}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: "${SMTP_FROM:-RACEPORTAL <kontakt@raceportal.pl>}"
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    mem_limit: 512m

  backup:
    image: mysql:8.4
    container_name: raceportal-backup
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-raceportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raceportal}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - raceportal_backups_vm:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup.sh
        while true; do
          /backup.sh || true
          sleep 86400
        done
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  raceportal_mysql_vm:
  raceportal_backups_vm:
