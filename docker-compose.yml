#
# docker-compose.yml — lokalny stack RacePortal (dev / demo).
#
# Usługi:
#   mysql     — MySQL 8.4, baza `raceportal`, port hosta 3307→3306 (unika kolizji z lokalnym MySQL).
#   api       — Spring Boot (backend/Dockerfile), profil `docker`, seed włączony, JWT/CORS pod web+mobile.
#   web       — Vite build + nginx (web/Dockerfile, context = root repo — potrzebny packages/api-types).
#   backup    — pętla scripts/backup.sh co 24h → volume raceportal_backups.
#
# Maile idą SMTP na skrzynki użytkowników (Mailbux). Hasło nie jest w repo:
# w katalogu projektu plik `.env` z jedną linią `SMTP_PASSWORD=...` (App Password skrzynki).
#
# Dlaczego osobno od testów: JUnit/create-drop celuje w `raceportal_test` (patrz scripts/test-api.sh),
# żeby nie wycierać tej bazy Compose z seedem.
#
# Porty (host): API 4000, web 8081, MySQL 3307.
#
# Pomysł (alt): docker-compose.override.yml pod produkcję (bez SEED_ENABLED, secrets z vault);
# albo profile compose (dev/test/prod) zamiast jednego pliku.
#
services:
  mysql:
    image: mysql:8.4
    container_name: raceportal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: raceportal
      MYSQL_USER: raceportal
      MYSQL_PASSWORD: raceportal
    ports:
      - "3307:3306"
    volumes:
      - raceportal_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    container_name: raceportal-api
    env_file:
      - ./backend/.env.example
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:mysql://mysql:3306/raceportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: raceportal
      DATABASE_PASSWORD: raceportal
      SMTP_HOST: my.mailbux.com
      SMTP_PORT: "587"
      SMTP_USERNAME: noreply@raceportal.pl
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      SMTP_FROM: "RACEPORTAL <noreply@raceportal.pl>"
      # Linki w mailach (aktywacja). Lokalnie nadpisz w `.env`: PUBLIC_BASE_URL=http://localhost:8081
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://raceportal.pl}
      CORS_ORIGIN: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8082,http://127.0.0.1:8082,https://*.trycloudflare.com,https://*.pages.dev,https://raceportal.pl,https://www.raceportal.pl,https://bo.raceportal.pl
      JWT_SECRET: raceportal-dev-secret-change-me
      JWT_ACCESS_TOKEN_MINUTES: "15"
      JWT_REFRESH_TOKEN_DAYS: "7"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Prod (Oracle .env): COOKIE_SECURE=true i COOKIE_DOMAIN=.raceportal.pl
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SEED_ENABLED: "true"
      ALLOW_INSECURE_DEFAULTS: "true"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - raceportal_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: raceportal-web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: mysql:8.4
    container_name: raceportal-backup
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: raceportal
      MYSQL_PASSWORD: raceportal
      MYSQL_DATABASE: raceportal
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - raceportal_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup.sh
        while true; do
          /backup.sh || true
          sleep 86400
        done
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  raceportal_mysql:
  raceportal_backups:
  raceportal_uploads:
