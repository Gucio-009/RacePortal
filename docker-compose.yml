services:
  db:
    image: postgres:16-alpine
    container_name: raceportal-db
    environment:
      POSTGRES_USER: raceportal
      POSTGRES_PASSWORD: raceportal
      POSTGRES_DB: raceportal
    ports:
      - "5433:5432"
    volumes:
      - raceportal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raceportal -d raceportal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailhog:
    # Mailpit — multi-arch (arm64/amd64), SMTP 1025 + UI 8025
    image: axllent/mailpit:v1.21
    container_name: raceportal-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  api:
    build: ./backend
    container_name: raceportal-api
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://raceportal:raceportal@db:5432/raceportal?schema=public
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      CORS_ORIGIN: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8082,http://127.0.0.1:8082
      JWT_SECRET: raceportal-dev-secret-change-me
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./web
    container_name: raceportal-web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: raceportal-backup
    environment:
      DATABASE_URL: postgresql://raceportal:raceportal@db:5432/raceportal
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - raceportal_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache gzip >/dev/null
        chmod +x /backup.sh
        while true; do
          /backup.sh || true
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  raceportal_pg:
  raceportal_backups:
