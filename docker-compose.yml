version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: raceportal_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    
  backend-api:
    build: ./backend_raceportal
    container_name: spring-app
    ports:
      - "8080:8080"
    volumes:
      - ./backend-data:/app/data # Mapuje folder w Dockerze na folder na Twoim komputerze
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  frontend-ui:
    build: ./frontend_raceportal
    container_name: react-app
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  
volumes:
  db_data: