#
# application-docker.yml — profil `docker` (kontener api w Compose).
#
# Nadpisuje hosty: MySQL = hostname usługi `mysql`, SMTP = Mailbux (STARTTLS).
# Reszta (JWT, seed, CORS) idzie z env w docker-compose.yml.
# Hasło: SMTP_PASSWORD z pliku `.env` w katalogu projektu (nie commituj).
#
# Pomysł (alt): ConfigMap/Secrets w K8s zamiast pliku profilu; Spring Cloud Config.
#
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/raceportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:raceportal}
    password: ${DATABASE_PASSWORD:raceportal}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  mail:
    host: ${SMTP_HOST:my.mailbux.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:kontakt@raceportal.pl}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: true
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

app:
  mail:
    from: "${SMTP_FROM:RACEPORTAL <kontakt@raceportal.pl>}"
  cors:
    origin: ${CORS_ORIGIN:*}

logging:
  level:
    root: INFO
