#
# application.yml — domyślna konfiguracja Spring Boot (profil default / lokalny).
#
# Technologie: Spring Boot 3, Spring Data JPA + Hibernate, HikariCP, Caffeine cache,
# JavaMailSender, własny JWT (app.jwt.*), opcjonalnie Google OAuth client-id.
#
# Kluczowe decyzje:
#   - open-in-view: false — brak lazy-load poza transakcją (bezpieczniejsze API).
#   - ddl-auto: update — wygodne na MVP; w prod lepiej migrate (Flyway/Liquibase).
#   - cache events (Caffeine 20s) — przyspiesza listę; unieważniane przy zapisach.
#   - SEED_ENABLED — DataInitializer (konta demo, wydarzenia, auta).
#
# Pomysł (alt): PostgreSQL zamiast MySQL; Redis zamiast Caffeine (wiele instancji API);
# Keycloak/Auth0 zamiast własnego JWT; Vault/SOPS na sekrety zamiast env w compose.
#
server:
  port: ${PORT:4000}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: raceportal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST:6MB}
  datasource:
    # Lokalnie: MySQL na 3306; w Docker Compose nadpisywane w application-docker.yml / env.
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/raceportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:raceportal}
    password: ${DATABASE_PASSWORD:raceportal}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  mail:
    # Dev: Mailpit/Mailhog na :1025 (UI :8025). Prod: prawdziwy SMTP + STARTTLS.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  cache:
    type: caffeine
    cache-names: events
    caffeine:
      spec: maximumSize=500,expireAfterWrite=20s

app:
  # Bazowy URL frontu — linki aktywacyjne w mailach.
  # Lokalnie (java / compose): PUBLIC_BASE_URL=http://localhost:8081
  # Docker profile / prod: domyślnie https://raceportal.pl (patrz application-docker.yml).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8081}
  cors:
    # W compose: lista originów web (8081) + Vite (5173) + Expo web (8082).
    origin: ${CORS_ORIGIN:*}
  jwt:
    secret: ${JWT_SECRET:raceportal-dev-secret-change-me}
    # Access JWT (minuty). Stary JWT_EXPIRATION_DAYS nie steruje już access TTL.
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cookies:
    # Prod za HTTPS / Tunnel: COOKIE_SECURE=true
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    # Prod: .raceportal.pl — sesja wspólna raceportal.pl ↔ bo.raceportal.pl. Lokalnie puste.
    domain: ${COOKIE_DOMAIN:}
  security:
    # true = lokalnie/demo (compose). Prod: ALLOW_INSECURE_DEFAULTS=false + silny JWT_SECRET + SEED_ENABLED=false.
    allow-insecure-defaults: ${ALLOW_INSECURE_DEFAULTS:true}
  mail:
    from: ${SMTP_FROM:RACEPORTAL <noreply@raceportal.local>}
  maps:
    # Opcjonalnie Google Directions; bez klucza MapsService używa OSRM publicznego.
    google-api-key: ${GOOGLE_MAPS_API_KEY:}
  oauth:
    google:
      # Puste = endpoint Google wyłączony / zwraca błąd konfiguracji.
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  seed:
    # Poza demo/test: false. Compose ustawia SEED_ENABLED=true.
    enabled: ${SEED_ENABLED:false}
  upload:
    # Katalog lokalny na JPG/PNG/WebP (garaż, plakat, potwierdzenie). Compose: volume.
    dir: ${UPLOAD_DIR:uploads}
    max-bytes: ${UPLOAD_MAX_BYTES:5242880}

logging:
  level:
    root: INFO
    pl.raceportal: INFO
